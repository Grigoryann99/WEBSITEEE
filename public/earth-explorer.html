<div id="stage"></div>
<div class="top"><div><p class="eyebrow">A little perspective</p><h2 class="title" id="selected-label">The world is yours to explore.</h2></div><span class="tag">51 destination guides</span></div>

<script type="module">

function hit(event){const bounds=renderer.domElement.getBoundingClientRect(),x=event.clientX-bounds.left,y=event.clientY-bounds.top;const view=camera.position.clone().normalize();let closest=null,distance=16;for(const pin of pins){if(!pin.visible)continue;if(pin.position.clone().normalize().dot(view)<1/camera.position.length())continue;const p=pin.position.clone().project(camera);const d=Math.hypot((p.x*.5+.5)*bounds.width-x,(-p.y*.5+.5)*bounds.height-y);if(d<distance){closest=pin.userData.country;distance=d;}}if(closest)return {country:closest,name:closest.name};const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x/bounds.width*2-1,1-y/bounds.height*2),camera);const point=ray.intersectObject(earth)[0]?.point;if(!point)return null;const lat=THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(point.y,-1,1))),lng=THREE.MathUtils.radToDeg(Math.atan2(-point.z,point.x));const feature=world.features.find(f=>inGeometry(lng,lat,f.geometry));return feature?{feature,country:world.countries.find(c=>c.iso2===feature.iso2),name:feature.name}:null;}

    const nightMaterial=material(new THREE.ShaderMaterial({uniforms:{map:{value:night},sun:{value:sunPosition}},vertexShader:'varying vec2 vUv;varying vec3 n;void main(){vUv=uv;n=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D map;uniform vec3 sun;varying vec2 vUv;varying vec3 n;void main(){float dark=1.-smoothstep(-.2,.15,dot(normalize(n),sun));vec3 lights=texture2D(map,vUv).rgb;gl_FragColor=vec4(lights*dark*.25, dark);}',transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));const nightMesh=new THREE.Mesh(sphere,nightMaterial);nightMesh.scale.setScalar(1.001);scene.add(nightMesh);

    const atmosphere=new THREE.Mesh(sphere,material(new THREE.ShaderMaterial({uniforms:{sun:{value:sunPosition}},vertexShader:'varying vec3 n;varying vec3 v;varying vec3 w;void main(){w=normalize(mat3(modelMatrix)*normal);vec4 p=modelViewMatrix*vec4(position,1.);n=normalize(normalMatrix*normal);v=normalize(-p.xyz);gl_Position=projectionMatrix*p;}',fragmentShader:'uniform vec3 sun;varying vec3 w;varying vec3 n;varying vec3 v;void main(){float rim=pow(max(0.,1.-abs(dot(normalize(n),normalize(v)))),3.5);gl_FragColor=vec4(.22,.58,.96,rim*.4*(.08+.92*smoothstep(-.35,.55,dot(normalize(w),sun))));}',side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));atmosphere.scale.setScalar(1.025);scene.add(atmosphere);

    ring=new THREE.Mesh(geometry(new THREE.RingGeometry(.024,.032,32)),material(new THREE.MeshBasicMaterial({color:0xe0f4ff,side:THREE.DoubleSide,transparent:true,opacity:.95,depthWrite:false})));ring.visible=false;scene.add(ring);
    worldBorders=outline(world.features,0xb2d5ec,.2);worldBorders.visible=false;scene.add(worldBorders);
    let seed=97;const random=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
    const starCanvas=document.createElement('canvas');starCanvas.width=32;starCanvas.height=32;const ctx=starCanvas.getContext('2d');const gradient=ctx.createRadialGradient(16,16,0,16,16,16);gradient.addColorStop(0,'rgba(255,255,255,1)');gradient.addColorStop(.12,'rgba(255,255,255,.9)');gradient.addColorStop(.4,'rgba(255,255,255,.22)');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fillRect(0,0,32,32);const starTexture=new THREE.CanvasTexture(starCanvas);textures.push(starTexture);

    $('destinations').onclick=()=>{const show=$('destinations').getAttribute('aria-pressed')!=='true';$('destinations').setAttribute('aria-pressed',String(show));for(const pin of pins)pin.visible=show;needsRender=true;};
    $('rotate').onclick=()=>setRotation(!rotating);$('zoom-in').onclick=()=>{focusTween=null;camera.position.setLength(Math.max(2.15,camera.position.length()*.86));controls.update();};$('zoom-out').onclick=()=>{focusTween=null;camera.position.setLength(Math.min(5,camera.position.length()*1.16));controls.update();};$('reset').onclick=()=>{focusTween={start:performance.now(),from:camera.position.clone().normalize(),to:position(24,54),distance:camera.position.length(),endDistance:3.3};setRotation(false);};$('borders').onclick=()=>{needsRender=true;worldBorders.visible=!worldBorders.visible;$('borders').setAttribute('aria-pressed',String(worldBorders.visible));};
